<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="metadados(titulo, descricao)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#b3121f">
        <meta name="description" th:content="${descricao}">
        <title th:text="${titulo} + ' | Rota Vital'">Rota Vital</title>
        <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </th:block>
</head>
<body>
<header class="topbar" th:fragment="topbar">
    <a class="brand" th:href="@{/}" aria-label="Rota Vital — página inicial">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <path class="brand-drop" d="M16 2.5c-.5 0-.9.2-1.2.6C12.2 6.7 5.5 15.6 5.5 20.8a10.5 10.5 0 0 0 21 0c0-5.2-6.7-14.1-9.3-17.7-.3-.4-.7-.6-1.2-.6Z"/>
            <polyline class="brand-pulse" points="9.5,21 13,21 14.6,16.8 17.2,24.6 18.8,19.8 22.5,19.8"/>
        </svg>
        <span class="brand-name">Rota<strong>Vital</strong></span>
    </a>
    <div class="account-actions" th:if="${autenticado}">
        <span class="account-email" th:text="${nomeUsuario}">usuario@exemplo.com</span>
        <form method="post" th:action="@{/logout}"><button class="button button-on-red" type="submit">Sair</button></form>
    </div>
    <nav class="account-actions" th:unless="${autenticado}" aria-label="Acesso">
        <a th:href="@{/login}">Entrar</a>
        <a class="button button-on-red" th:href="@{/registro}">Criar conta</a>
    </nav>
</header>
<aside class="sidebar" th:fragment="sidebar(ativa)">
    <p class="sidebar-title">Distribuição</p>
    <nav aria-label="Etapas da distribuição">
        <a th:href="@{/estoque}" th:attr="aria-current=${ativa == 'index' ? 'page' : null}"><span class="step">01</span><span>Estoque</span></a>
        <a th:href="@{/requisicao}" th:attr="aria-current=${ativa == 'requisicao' ? 'page' : null}"><span class="step">02</span><span>Requisição</span></a>
        <a th:href="@{/alocacao}" th:attr="aria-current=${ativa == 'alocacao' ? 'page' : null}"><span class="step">03</span><span>Alocação</span></a>
        <a th:href="@{/rota}" th:attr="aria-current=${ativa == 'rota' ? 'page' : null}"><span class="step">04</span><span>Rota</span></a>
        <a th:href="@{/monitoramento}" th:attr="aria-current=${ativa == 'monitoramento' ? 'page' : null}"><span class="step">05</span><span>Monitoramento</span></a>
    </nav>
    <div class="unit" th:if="${usuario != null}">
        <span class="avatar" aria-hidden="true" th:text="${#strings.toUpperCase(#strings.substring(usuario.nome, 0, 1))}">A</span>
        <div><strong th:text="${usuario.nome}">Usuário</strong><span>Conectado ao Rota Vital</span></div>
    </div>
</aside>
<th:block th:fragment="mensagens">
    <p class="flash flash-ok" role="status" th:if="${sucesso}" th:text="${sucesso}"></p>
    <p class="flash flash-erro" role="alert" th:if="${erro}" th:text="${erro}"></p>
    <p class="flash flash-aviso" role="status" th:if="${aviso}" th:text="${aviso}"></p>
</th:block>
<span th:fragment="statusRemessa(status)" class="badge"
      th:classappend="${status.name() == 'PENDENTE_AVALIACAO'} ? 'badge-alerta' : (${status.name() == 'ENTREGUE'} ? 'badge-ok' : (${status.name() == 'AGUARDANDO_ROTA'} ? 'badge-aviso' : 'badge-info'))"
      th:text="${status.rotulo}">Situação</span>
<footer class="screen-footer" th:fragment="rodape">
    Simulação acadêmica · compatibilidade didática · não substitui protocolo clínico.
</footer>
</body>
</html>
