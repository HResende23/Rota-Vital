<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: metadados('Registro', 'Registro de usuários do Rota Vital.')}"></th:block>
    <script th:src="@{/js/acesso.js}" defer></script>
</head>
<body class="auth-page auth-register">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header th:replace="~{fragments/layout :: topbar}"></header>
    <main id="conteudo" class="auth-main">
        <section class="auth-content" aria-labelledby="titulo">
            <header class="page-heading">
                <p class="eyebrow">Cadastro</p>
                <h1 id="titulo">Criar sua conta</h1>
                <p class="subtitle">Preencha seus dados para acessar o Rota Vital.</p>
            </header>
            <p class="auth-feedback" role="alert" th:if="${erro}" th:text="${erro}"></p>
            <form class="auth-form" method="post" th:action="@{/registro}" data-registro>
                <label for="nome">Nome completo
                    <input id="nome" name="nome" th:value="${nome}" type="text" autocomplete="name" placeholder="Seu nome completo" maxlength="200" required>
                </label>
                <label for="email">E-mail
                    <input id="email" name="email" th:value="${email}" type="email" autocomplete="email" placeholder="seu.email@exemplo.com" maxlength="254" required>
                </label>
                <label for="senha">Senha
                    <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="Mínimo de 8 caracteres" required>
                </label>
                <label for="confirmacao">Confirmar senha
                    <input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" minlength="8" maxlength="72" placeholder="Repita a senha" required>
                </label>
                <button class="button auth-submit" type="submit">Criar conta</button>
                <a class="auth-link" th:href="@{/login}">Já possui uma conta? Entrar</a>
            </form>
        </section>
    </main>
    <footer class="auth-footer">Simulação acadêmica · compatibilidade didática · não substitui protocolo clínico.</footer>
</body>
</html>
