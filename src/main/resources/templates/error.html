<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Solicitação não concluída | Rota Vital</title><link rel="stylesheet" href="/css/styles.css"></head>
<body class="auth-page">
<header th:replace="~{fragments/layout :: topbar}"></header>
<main class="auth-main"><section class="auth-content">
<h1>Não foi possível concluir a solicitação</h1>
<p th:if="${status == 403}">Você não tem permissão para esta operação ou o formulário expirou. Abra a página novamente e tente outra vez.</p>
<p th:if="${status == 404}">O registro ou a página não foi encontrado.</p>
<p th:unless="${status == 403 or status == 404}">Confira os dados enviados e tente novamente.</p>
<a class="button" th:href="@{/}">Voltar ao início</a>
</section></main></body></html>
