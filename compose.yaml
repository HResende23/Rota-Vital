services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rotavital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rotavital_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rotavital"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rotavital
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: rotavital_local
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: